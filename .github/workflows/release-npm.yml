name: Release to npm

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "✓ tag $GITHUB_REF_NAME matches package.json $PKG_VERSION"

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # OIDC trusted publishing needs npm >= 11.5.1; node 22 bundles npm 10.
      # Pinned rather than @latest so the release path stays deterministic.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@11.15.0

      # Auth comes from the OIDC trusted publisher configured on npmjs.com
      # (repo nuttaruj/rolepod-wplab + this workflow file) — no token secret.
      - name: Publish to npm
        run: npm publish --provenance --access public
